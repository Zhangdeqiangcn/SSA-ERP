name: E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ssa-erp/package-lock.json
    
    - name: Install dependencies
      run: cd ssa-erp && npm ci
    
    - name: Install Playwright browsers
      run: cd ssa-erp && npx playwright install --with-deps chromium
    
    - name: Build
      run: cd ssa-erp && npm run build
    
    - name: Run E2E tests
      run: cd ssa-erp && npx playwright test --reporter=list
    
    - name: Upload report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: ssa-erp/test-results/
        retention-days: 30
